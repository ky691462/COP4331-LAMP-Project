<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="css/styles.css"><title>Sign in - Contact Manager</title><meta name="description" content="Sign in to your contacts."></head>
<body><header class="bar"><a class="logo" href="index.html">Contact Manager</a></header>
<main><div class="card"><h1>Sign in</h1>
<form id="auth-form" data-mode="login"><label for="login">Username</label><input id="login" name="login" autocomplete="username" required>
<label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required>
<p id="msg" class="msg" role="status" aria-live="polite"></p><button class="btn full">Sign in</button></form>
<p class="foot">New here? <a href="register.html">Create an account</a></p></div></main>
<script src="js/common.js"></script><script src="js/auth.js"></script></body></html>
